name: Build Predictive Input (Android64)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android build project
        uses: actions/checkout@v4
        with:
          repository: ZakME/GDPredictiveInputModGeode
          ref: main
          path: mod-src

      - name: Set Geode v6 and Android GD target
        working-directory: mod-src
        run: |
          python3 - <<'PY'
          import json
          p = "mod.json"
          with open(p, encoding="utf-8") as f:
              data = json.load(f)
          data["geode"] = "v6.0.0-alpha.2"
          data["gd"] = {"android": "2.2091"}
          data["version"] = "v1.0.1-android64-ci"
          with open(p, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\\n")
          p = "src/Hooks.cpp"
          with open(p, encoding="utf-8") as f:
              source = f.read()
          old = "constexpr uintptr_t kGameEventTriggered = 0x33ac80;"
          new = """#if defined(GEODE_IS_ANDROID)
    constexpr uintptr_t kGameEventTriggered = 0x9ba44c;
#else
    constexpr uintptr_t kGameEventTriggered = 0x33ac80;
#endif"""
          if old not in source:
              raise SystemExit("Expected hook offset declaration not found; refusing to patch")
          with open(p, "w", encoding="utf-8") as f:
              f.write(source.replace(old, new, 1))
          PY

      - name: Build Geode mod for Android64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-alpha.2
          cli: latest
          target: Android64
          path: mod-src
          build-config: Release

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: PredictiveInput-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
