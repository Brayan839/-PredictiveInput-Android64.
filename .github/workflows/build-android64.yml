name: Build Predictive Input (Android64)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4
        with:
          repository: ZakME/GDPredictiveInputModGeode
          ref: main
          path: mod-src

      - name: Checkout Geode SDK
        uses: actions/checkout@v4
        with:
          repository: geode-sdk/geode
          ref: v6.0.0-alpha.2
          path: geode-sdk

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Configure Android target
        working-directory: mod-src
        env:
          GEODE_SDK: ${{ github.workspace }}/geode-sdk
        run: |
          cmake -S . -B build-android64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24

      - name: Build
        working-directory: mod-src
        env:
          GEODE_SDK: ${{ github.workspace }}/geode-sdk
        run: cmake --build build-android64 --parallel 2

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: PredictiveInput-Android64
          path: |
            mod-src/build-android64/**/*.geode
            mod-src/build-android64/**/*.so
          if-no-files-found: error
