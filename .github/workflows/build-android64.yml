name: Build Predictive Input (Android64)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android build project
        uses: actions/checkout@v4
        with:
          repository: ZakME/GDPredictiveInputModGeode
          ref: main
          path: mod-src

      - name: Set Geode v6 beta 2 and Android GD target
        working-directory: mod-src
        run: |
          python3 -c 'import json; p="mod.json"; d=json.load(open(p)); d["geode"]="6.0.0-beta.2"; d["gd"]={"android":"2.2091"}; d["version"]="v1.0.4-beta.2"; json.dump(d,open(p,"w"),indent=2)'
          python3 -c 'from pathlib import Path; p=Path("src/Hooks.cpp"); s=p.read_text(); old="constexpr uintptr_t kGameEventTriggered = 0x33ac80;"; nl=chr(10); new="#if defined(GEODE_IS_ANDROID)"+nl+"    constexpr uintptr_t kGameEventTriggered = 0x9ba44c;"+nl+"#else"+nl+"    constexpr uintptr_t kGameEventTriggered = 0x33ac80;"+nl+"#endif"; assert old in s, "Expected hook offset declaration not found"; p.write_text(s.replace(old,new,1))'

      - name: Adapt PlayerObject state for Android64
        working-directory: mod-src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Offsets verified against the supplied Geometry Dash 2.2091 Android64
          # libcocos2dcpp.so (Build ID 93dbe2d3bd6a946d6fd2a73a4e5f82293e5a21c3).
          p = Path("src/Layout.cpp")
          s = p.read_text()
          offsets = {
              "m_collisionLogTop": ("0x5b0", "0x5a8"),
              "m_collisionLogRight": ("0x5c8", "0x5c0"),
              "m_lastCollisionBottom": ("0x5d0", "0x5c8"),
                            "m_yVelocity": ("0x9a8", "0x958"),
              "m_isShip": ("0x9c1", "0x971"),
              "m_isUpsideDown": ("0x9c7", "0x977"),
              "m_isDead": ("0x9c8", "0x978"),
              "m_isOnGround": ("0x9c9", "0x979"),
              "m_isSwing": ("0x9cc", "0x97c"),
              "m_maybeReverseSpeed": ("0x9d8", "0x988"),
              "m_isDashing": ("0x9ec", "0x99c"),
              "m_vehicleSize": ("0x9f8", "0x9a8"),
              "m_playerSpeed": ("0x9fc", "0x9ac"),
              "m_shipRotation": ("0xa00", "0x9b0"),
              "m_unkUnused3": ("0xa10", "0x9c0"),
              "m_isLocked": ("0xa32", "0x9e2"),
              "m_controlsDisabled": ("0xa33", "0x9e3"),
              "m_lastGroundedPos": ("0xa34", "0x9e4"),
              "m_touchingRings": ("0xa40", "0x9f0"),
              "m_touchedRings": ("0xa48", "0x9f8"),
              "m_position": ("0xa98", "0xa30"),
              "m_totalTime": ("0xaa8", "0xa40"),
              "m_platformerXVelocity": ("0xb00", "0xa98"),
              "m_holdingButtons": ("0xbc0", "0xb60"),
              "m_actionManager": ("0xc38", "0xbd8"),
          }
          stale_member = "PIB_EXPECT_OFFSET(PlayerObject, m_unk50C, 0x5e0);" + chr(10)
          if s.count(stale_member) != 1:
              raise SystemExit("Expected outdated m_unk50C assertion exactly once")
          s = s.replace(stale_member, "// m_unk50C is absent from Android 2.2091 PlayerObject bindings." + chr(10), 1)
          for member, (old, new) in offsets.items():
              old_line = f"PIB_EXPECT_OFFSET(PlayerObject, {member}, {old});"
              new_line = f"PIB_EXPECT_OFFSET(PlayerObject, {member}, {new});"
              if s.count(old_line) != 1:
                  raise SystemExit(f"Expected exactly one assertion: {old_line}")
              s = s.replace(old_line, new_line, 1)
          # These Geode binding offsets are wrong for the Android64 2.2091 runtime.
          # Hooks.cpp reads the actual fields at 0xCE0, 0xCE8, 0xCF0 and 0x3F2.
          stale_assertions = [
              "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_player1, 0xdb8);",
              "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_player2, 0xdc0);",
              "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_levelSettings, 0xdc8);",
          ]
          for assertion in stale_assertions:
              if s.count(assertion) != 1:
                  raise SystemExit(f"Expected exactly one stale binding assertion: {assertion}")
              s = s.replace(assertion, "// Android64 runtime offset is read directly in Hooks.cpp." + chr(10), 1)

          stale_dual_start = s.find("static_assert(offsetof(GJBaseGameLayer, m_gameState)")
          stale_dual_end = s.find(");", stale_dual_start)
          if stale_dual_start < 0 or stale_dual_end < 0:
              raise SystemExit("Could not locate outdated dual-mode offset assertion")
          stale_dual = s[stale_dual_start:stale_dual_end + 2]
          if "m_isDualMode" not in stale_dual or "0x422" not in stale_dual:
              raise SystemExit("Unexpected dual-mode assertion contents")
          s = s[:stale_dual_start] + "// Android64 m_isDualMode is read at GJBaseGameLayer + 0x3F2 in Hooks.cpp." + s[stale_dual_end + 2:]

          # Remaining type sizes and independently checked Android64 offsets.
          layout_replacements = {
              'static_assert(sizeof(PlayerObject) == 0xc50, "PlayerObject size changed");':
                  'static_assert(sizeof(PlayerObject) == 0xbf0, "PlayerObject size changed");',
              "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_isPlatformer, 0x317e);":
                  "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_isPlatformer, 0x2fce);",
              "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_useReplay, 0x3280);":
                  "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_useReplay, 0x30a0);",
              "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_clickBetweenSteps, 0x38f1);":
                  "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_clickBetweenSteps, 0x3679);",
          }
          for old, new in layout_replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f"Expected exactly one layout expression: {old}")
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Current bindings use m_usedRings instead of the old m_ringRelatedSet.
          # m_jumpPadRelated was removed from 2.2091 bindings and is not copied.
          p = Path("src/generated/PlayerStateCopy.inc")
          lines = p.read_text().splitlines()
          out = []
          found_ring = found_pad = 0
          for line in lines:
              if line.strip() == "dst->m_ringRelatedSet = src->m_ringRelatedSet;":
                  out.append("dst->m_usedRings = src->m_usedRings;")
                  found_ring += 1
              elif line.strip() == "dst->m_jumpPadRelated = src->m_jumpPadRelated;":
                  found_pad += 1
              elif line.strip() in {
                  "dst->m_stateNoStickX = src->m_stateNoStickX;",
                  "dst->m_stateNoStickY = src->m_stateNoStickY;",
                  "dst->m_stateUnk2 = src->m_stateUnk2;",
              }:
                  # These legacy fields do not exist in Android 2.2091 bindings.
                  pass
              else:
                  out.append(line)
          if found_ring != 1 or found_pad != 1:
              raise SystemExit(f"Unexpected generated fields: ring={found_ring}, pad={found_pad}")
          p.write_text("\n".join(out) + "\n")

          # Keep the generator's container allow-list current.
          p = Path("tools/gen-player-copy.mjs")
          s = p.read_text()
          old = '"m_ringRelatedSet", "m_touchedRings", "m_jumpPadRelated", "m_holdingButtons"'
          new = '"m_usedRings", "m_touchedRings", "m_holdingButtons"'
          if s.count(old) != 1:
              raise SystemExit("Expected container allow-list was not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Stabilize Android self-check and status label
        working-directory: mod-src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/Hooks.cpp")
          s = p.read_text()

          old = """                startSelfCheck(play, static_cast<PIBPlayLayer*>(play)->simPlayer(), tick);"""
          new = """#if !defined(GEODE_IS_ANDROID)
                          startSelfCheck(play, static_cast<PIBPlayLayer*>(play)->simPlayer(), tick);
          #endif"""
          if s.count(old) != 1:
              raise SystemExit("Expected Android self-check call exactly once")
          s = s.replace(old, new, 1)

          start = s.find('        auto label = CCLabelBMFont::create("", "chatFont.fnt");')
          finish = s.find("        this->refreshStatus();", start)
          if start < 0 or finish < 0:
              raise SystemExit("Could not locate status label creation lines")
          finish += len("        this->refreshStatus();")
          new = """        auto label = CCLabelBMFont::create("Input Buffer", "chatFont.fnt");
                  if (!label) label = CCLabelBMFont::create("Input Buffer", "bigFont.fnt");
                  if (label) {
                      auto winSize = CCDirector::get()->getWinSize();
                      label->setAnchorPoint({ 0.f, 1.f });
                      label->setScale(0.5f);
                      label->setOpacity(220);
                      label->setPosition({ 8.f, winSize.height - 24.f });
                      label->setZOrder(100000);
                      this->addChild(label, 100000);
                      m_fields->status = label;
                      this->refreshStatus();
                  }
                  else {
                      log::error("Predictive Input: could not create status label (chatFont.fnt/bigFont.fnt)");
                  }"""
          s = s[:start] + new + s[finish:]
          p.write_text(s)
          PY

      - name: Fix live input interception and expose predictor decisions
        working-directory: mod-src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          nl = chr(10)
          p = Path("src/Hooks.cpp")
          s = p.read_text()

          old_include = '#include <cmath>'
          new_include = '#include <cmath>' + nl + '#include <cstdint>'
          if s.count(old_include) != 1:
              raise SystemExit("Expected <cmath> include exactly once")
          s = s.replace(old_include, new_include, 1)

          # Geode's 2.2091 Android64 generated fields are displaced from the
          # runtime layout. These offsets were verified from this device-build
          # libcocos2dcpp.so (Build ID 93dbe2d3bd6a946d6fd2a73a4e5f82293e5a21c3):
          # player1=0xCE0, player2=0xCE8, levelSettings=0xCF0, dual=0x3F2.
          helper_marker = (
              '    PlayLayer* currentPlayLayer() {' + nl +
              '        return g_playLayer;' + nl +
              '    }'
          )
          helper_block = helper_marker + nl + nl + (
              '#if defined(GEODE_IS_ANDROID) && defined(__aarch64__)' + nl +
              '    template <typename T>' + nl +
              '    T* readAndroidLayerPointer(GJBaseGameLayer* layer, std::uintptr_t offset) {' + nl +
              '        auto address = reinterpret_cast<std::uintptr_t>(layer) + offset;' + nl +
              '        return *reinterpret_cast<T* const*>(address);' + nl +
              '    }' + nl + nl +
              '    PlayerObject* pibPlayer1(GJBaseGameLayer* layer) {' + nl +
              '        return readAndroidLayerPointer<PlayerObject>(layer, 0xCE0);' + nl +
              '    }' + nl +
              '    PlayerObject* pibPlayer2(GJBaseGameLayer* layer) {' + nl +
              '        return readAndroidLayerPointer<PlayerObject>(layer, 0xCE8);' + nl +
              '    }' + nl +
              '    LevelSettingsObject* pibLevelSettings(GJBaseGameLayer* layer) {' + nl +
              '        return readAndroidLayerPointer<LevelSettingsObject>(layer, 0xCF0);' + nl +
              '    }' + nl +
              '    bool pibDualMode(GJBaseGameLayer* layer) {' + nl +
              '        auto address = reinterpret_cast<std::uintptr_t>(layer) + 0x3F2;' + nl +
              '        return *reinterpret_cast<std::uint8_t const*>(address) != 0;' + nl +
              '    }' + nl +
              '#else' + nl +
              '    PlayerObject* pibPlayer1(GJBaseGameLayer* layer) { return layer->m_player1; }' + nl +
              '    PlayerObject* pibPlayer2(GJBaseGameLayer* layer) { return layer->m_player2; }' + nl +
              '    LevelSettingsObject* pibLevelSettings(GJBaseGameLayer* layer) { return layer->m_levelSettings; }' + nl +
              '    bool pibDualMode(GJBaseGameLayer* layer) { return layer->m_gameState.m_isDualMode; }' + nl +
              '#endif'
          )
          if s.count(helper_marker) != 1:
              raise SystemExit("Could not find currentPlayLayer helper insertion point")
          s = s.replace(helper_marker, helper_block, 1)

          # Replace every affected use of the generated fields with verified
          # runtime accessors on Android64.
          field_replacements = {
              'player == m_player1': 'player == pibPlayer1(this)',
              'auto player = layer->m_player1;': 'auto player = pibPlayer1(layer);',
              'auto player = play->m_player1;': 'auto player = pibPlayer1(play);',
              'this == layer->m_player1': 'this == pibPlayer1(layer)',
              'auto levelSettings = layer->m_levelSettings;': 'auto levelSettings = pibLevelSettings(layer);',
              'bool twoPlayer = layer->m_levelSettings && layer->m_levelSettings->m_twoPlayerMode;':
                  'auto* levelSettings = pibLevelSettings(layer);' + nl +
                  '        bool twoPlayer = levelSettings && levelSettings->m_twoPlayerMode;',
              'bool dual = layer->m_gameState.m_isDualMode;': 'bool dual = pibDualMode(layer);',
          }
          for old_field, new_field in field_replacements.items():
              if s.count(old_field) != 1:
                  raise SystemExit(f"Expected exactly one field access to replace: {old_field}")
              s = s.replace(old_field, new_field, 1)

          # In a live PlayLayer, m_useReplay is the authoritative replay guard.
          old = 'if (layer->m_useReplay || layer->m_playbackMode != PlaybackMode::Not) return false;'
          new = 'if (layer->m_useReplay) return false;'
          if s.count(old) != 1:
              raise SystemExit("Expected replay guard exactly once")
          s = s.replace(old, new, 1)

          # Mark real touch events as soon as they reach the input hook.
          old = 'if (!InputQueue::isFiring()) noteInput(down, queue.currentTick());'
          new = (
              'if (!InputQueue::isFiring()) {' + nl +
              '                noteInput(down, queue.currentTick());' + nl +
              '                lastSave = down ? "input received" : "release received";' + nl +
              '                refreshStatus();' + nl +
              '                log::debug("input hook received {} at tick {}",' + nl +
              '                    down ? "press" : "release", queue.currentTick());' + nl +
              '            }'
          )
          if s.count(old) != 1:
              raise SystemExit("Expected live input tracking call exactly once")
          s = s.replace(old, new, 1)

          old = 'log::debug("{} checked in {} us: no delay", down ? "press" : "release", decision.micros);'
          new = (
              'lastSave = fmt::format("checked: no safe delay ({} us)", decision.micros);' + nl +
              '                refreshStatus();' + nl +
              '                log::info("{} checked in {} us: no safe delay",' + nl +
              '                    down ? "press" : "release", decision.micros);'
          )
          if s.count(old) != 1:
              raise SystemExit("Expected predictor no-delay log exactly once")
          s = s.replace(old, new, 1)

          old = 'int fireTick = earliest;' + nl + '        if (!relevant && !queue.empty()) {'
          if s.count(old) != 1:
              raise SystemExit("Expected relevant-input decision block exactly once")
          # Non-hold releases are intentionally chained behind their press.
          # Do not report them as "not buffered" because they are not predicted.
          s = s.replace(old, old, 1)

          # Do not use Android PlayerObject state flags as an input-routing filter.
          old = 'if (p && !p->m_isDead && !p->m_isLocked && !p->m_controlsDisabled) players.push_back(p);'
          new = 'if (p) players.push_back(p);'
          if s.count(old) != 1:
              raise SystemExit("Expected affected-player filter exactly once")
          s = s.replace(old, new, 1)

          # Use the verified Android field pointers and match vanilla routing:
          # if not dual, the input belongs to player 1; if dual+2P, it targets
          # the selected player; otherwise one input affects both dual players.
          old_route = (
              '        auto* levelSettings = pibLevelSettings(layer);' + nl +
              '        bool twoPlayer = levelSettings && levelSettings->m_twoPlayerMode;' + nl +
              '        bool dual = pibDualMode(layer);' + nl +
              '        auto add = [&](PlayerObject* p) {' + nl +
              '            if (p) players.push_back(p);' + nl +
              '        };' + nl +
              '        if (!twoPlayer || isPlayer1) add(layer->m_player1);' + nl +
              '        if (dual && (!twoPlayer || !isPlayer1)) add(layer->m_player2);'
          )
          new_route = (
              '        auto* levelSettings = pibLevelSettings(layer);' + nl +
              '        bool twoPlayer = levelSettings && levelSettings->m_twoPlayerMode;' + nl +
              '        bool dual = pibDualMode(layer);' + nl +
              '        auto* player1 = pibPlayer1(layer);' + nl +
              '        auto* player2 = pibPlayer2(layer);' + nl +
              '        auto add = [&](PlayerObject* p) {' + nl +
              '            if (p) players.push_back(p);' + nl +
              '        };' + nl +
              '        if (!dual) {' + nl +
              '            add(player1);' + nl +
              '        }' + nl +
              '        else if (twoPlayer) {' + nl +
              '            auto* selected = isPlayer1 ? player1 : player2;' + nl +
              '            if (selected) add(selected);' + nl +
              '            else add(player1);' + nl +
              '        }' + nl +
              '        else {' + nl +
              '            add(player1);' + nl +
              '            add(player2);' + nl +
              '        }' + nl +
              '        if (players.empty()) {' + nl +
              '            log::warn("Predictive Input: empty player selection (2P={}, dual={}, inputP1={}, p1={}, p2={})",' + nl +
              '                twoPlayer, dual, isPlayer1, player1 != nullptr, player2 != nullptr);' + nl +
              '        }'
          )
          if s.count(old_route) != 1:
              raise SystemExit("Expected affected-player routing block exactly once")
          s = s.replace(old_route, new_route, 1)

          p.write_text(s)
          PY

      - name: Enable prediction for Ship and Swing
        working-directory: mod-src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          nl = chr(10)
          p = Path("src/Predictor.cpp")
          s = p.read_text()

          old = "return mode == Gamemode::Wave;"
          if s.count(old) != 1:
              raise SystemExit("Expected one Wave hold-mode return")
          s = s.replace(old, "return mode == Gamemode::Wave || mode == Gamemode::Ship || mode == Gamemode::Swing;", 1)

          old = "return mode != Gamemode::Ship && mode != Gamemode::Swing;"
          if s.count(old) != 1:
              raise SystemExit("Expected one Ship/Swing exclusion")
          s = s.replace(old, "return true;", 1)

          old = "                case Gamemode::Wave:" + nl + "                    ticks = down ? g_rhythm.held : g_rhythm.released;"
          new = "                case Gamemode::Wave:" + nl + "                case Gamemode::Ship:" + nl + "                case Gamemode::Swing:" + nl + "                    ticks = down ? g_rhythm.held : g_rhythm.released;"
          if s.count(old) != 1:
              raise SystemExit("Expected one Wave rhythm branch")
          s = s.replace(old, new, 1)

          old = "                case Gamemode::Wave: {"
          if s.count(old) != 1:
              raise SystemExit("Expected one Wave request branch")
          s = s.replace(old, "                case Gamemode::Wave:" + nl + "                case Gamemode::Ship:" + nl + "                case Gamemode::Swing: {", 1)

          p.write_text(s)

          # Keep the settings UI accurate for all supported hold modes.
          meta = Path("mod.json")
          m = meta.read_text()
          m = m.replace("Buffer Releases (Wave)", "Buffer Releases (Wave, Ship, Swing)")
          m = m.replace("in wave, where letting go", "in wave, ship and swing, where releasing")
          m = m.replace("Most ticks to look ahead after an input in wave and UFO.", "Most ticks to look ahead after an input in wave, ship, swing and UFO.")
          meta.write_text(m)
          PY

      - name: Extend buffer limit to 64 ticks
        working-directory: mod-src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          p = Path('src/Settings.hpp')
          s = p.read_text()
          names = '''    inline constexpr std::array<std::string_view, 17> kModeNames = {
              "Disabled", "1 Tick", "2 Ticks", "4 Ticks", "6 Ticks",
              "8 Ticks", "10 Ticks", "12 Ticks", "14 Ticks", "16 Ticks",
              "24 Ticks", "32 Ticks", "40 Ticks", "48 Ticks",
              "56 Ticks", "60 Ticks", "64 Ticks"
          };
          inline constexpr std::array<int, 17> kModeTicks = {
              0, 1, 2, 4, 6, 8, 10, 12, 14, 16, 24, 32, 40, 48, 56, 60, 64
          };'''
          pattern = r'    inline constexpr std::array<std::string_view, 10> kModeNames = \{.*?    inline constexpr std::array<int, 10> kModeTicks = \{.*?\};'
          s, count = re.subn(pattern, names, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not replace 16-tick mode table')
          p.write_text(s)
          p = Path('mod.json')
          d = json.loads(p.read_text())
          d['settings']['mode']['one-of'] = ['Disabled', '1 Tick', '2 Ticks', '4 Ticks', '6 Ticks', '8 Ticks', '10 Ticks', '12 Ticks', '14 Ticks', '16 Ticks', '24 Ticks', '32 Ticks', '40 Ticks', '48 Ticks', '56 Ticks', '60 Ticks', '64 Ticks']
          d['settings']['cycle-mode']['description'] = 'Cycles through buffer limits from Disabled up to 64 ticks while playing a level.'
          d['version'] = 'v1.0.4-beta.2'
          p.write_text(json.dumps(d, indent=2) + '\n')
          PY

      - name: Build Geode mod for Android64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-beta.2
          cli: latest
          target: Android64
          path: mod-src
          build-config: Release

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: PredictiveInput-Android64-Beta2
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
