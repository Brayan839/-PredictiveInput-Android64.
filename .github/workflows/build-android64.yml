name: Build Predictive Input (Android64)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android build project
        uses: actions/checkout@v4
        with:
          repository: ZakME/GDPredictiveInputModGeode
          ref: main
          path: mod-src

      - name: Set Geode v6 beta 2 and Android GD target
        working-directory: mod-src
        run: |
          python3 -c 'import json; p="mod.json"; d=json.load(open(p)); d["geode"]="6.0.0-beta.2"; d["gd"]={"android":"2.2091"}; d["version"]="1.0.3-beta.2"; json.dump(d,open(p,"w"),indent=2)'
          python3 -c 'from pathlib import Path; p=Path("src/Hooks.cpp"); s=p.read_text(); old="constexpr uintptr_t kGameEventTriggered = 0x33ac80;"; nl=chr(10); new="#if defined(GEODE_IS_ANDROID)"+nl+"    constexpr uintptr_t kGameEventTriggered = 0x9ba44c;"+nl+"#else"+nl+"    constexpr uintptr_t kGameEventTriggered = 0x33ac80;"+nl+"#endif"; assert old in s, "Expected hook offset declaration not found"; p.write_text(s.replace(old,new,1))'

      - name: Adapt PlayerObject state for Android64
        working-directory: mod-src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Offsets verified against the supplied Geometry Dash 2.2091 Android64
          # libcocos2dcpp.so (Build ID 93dbe2d3bd6a946d6fd2a73a4e5f82293e5a21c3).
          p = Path("src/Layout.cpp")
          s = p.read_text()
          offsets = {
              "m_collisionLogTop": ("0x5b0", "0x5a8"),
              "m_collisionLogRight": ("0x5c8", "0x5c0"),
              "m_lastCollisionBottom": ("0x5d0", "0x5c8"),
              "m_unk50C": ("0x5e0", "0x5d8"),
              "m_yVelocity": ("0x9a8", "0x958"),
              "m_isShip": ("0x9c1", "0x971"),
              "m_isUpsideDown": ("0x9c7", "0x977"),
              "m_isDead": ("0x9c8", "0x978"),
              "m_isOnGround": ("0x9c9", "0x979"),
              "m_isSwing": ("0x9cc", "0x97c"),
              "m_maybeReverseSpeed": ("0x9d8", "0x988"),
              "m_isDashing": ("0x9ec", "0x99c"),
              "m_vehicleSize": ("0x9f8", "0x9a8"),
              "m_playerSpeed": ("0x9fc", "0x9ac"),
              "m_shipRotation": ("0xa00", "0x9b0"),
              "m_unkUnused3": ("0xa10", "0x9c0"),
              "m_isLocked": ("0xa32", "0x9e2"),
              "m_controlsDisabled": ("0xa33", "0x9e3"),
              "m_lastGroundedPos": ("0xa34", "0x9e4"),
              "m_touchingRings": ("0xa40", "0x9f0"),
              "m_touchedRings": ("0xa48", "0x9f8"),
              "m_position": ("0xa98", "0xa30"),
              "m_totalTime": ("0xaa8", "0xa40"),
              "m_platformerXVelocity": ("0xb00", "0xa98"),
              "m_holdingButtons": ("0xbc0", "0xb60"),
              "m_actionManager": ("0xc38", "0xbd8"),
          }
          for member, (old, new) in offsets.items():
              old_line = f"PIB_EXPECT_OFFSET(PlayerObject, {member}, {old});"
              new_line = f"PIB_EXPECT_OFFSET(PlayerObject, {member}, {new});"
              if s.count(old_line) != 1:
                  raise SystemExit(f"Expected exactly one assertion: {old_line}")
              s = s.replace(old_line, new_line, 1)
          # Remaining type sizes and GameLayer offsets from the Android64 2.2091 ABI.
          layout_replacements = {
              'static_assert(sizeof(PlayerObject) == 0xc50, "PlayerObject size changed");':
                  'static_assert(sizeof(PlayerObject) == 0xbf0, "PlayerObject size changed");',
              "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_player1, 0xdb8);":
                  "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_player1, 0xcb8);",
              "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_player2, 0xdc0);":
                  "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_player2, 0xcc0);",
              "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_levelSettings, 0xdc8);":
                  "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_levelSettings, 0xcc8);",
              "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_isPlatformer, 0x317e);":
                  "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_isPlatformer, 0x2fce);",
              "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_useReplay, 0x3280);":
                  "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_useReplay, 0x30a0);",
              "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_clickBetweenSteps, 0x38f1);":
                  "PIB_EXPECT_OFFSET(GJBaseGameLayer, m_clickBetweenSteps, 0x3679);",
              "offsetof(GJGameState, m_isDualMode) == 0x422,":
                  "offsetof(GJGameState, m_isDualMode) == 0x3f2,",
          }
          for old, new in layout_replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f"Expected exactly one layout expression: {old}")
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Current bindings use m_usedRings instead of the old m_ringRelatedSet.
          # m_jumpPadRelated was removed from 2.2091 bindings and is not copied.
          p = Path("src/generated/PlayerStateCopy.inc")
          lines = p.read_text().splitlines()
          out = []
          found_ring = found_pad = 0
          for line in lines:
              if line.strip() == "dst->m_ringRelatedSet = src->m_ringRelatedSet;":
                  out.append("dst->m_usedRings = src->m_usedRings;")
                  found_ring += 1
              elif line.strip() == "dst->m_jumpPadRelated = src->m_jumpPadRelated;":
                  found_pad += 1
              else:
                  out.append(line)
          if found_ring != 1 or found_pad != 1:
              raise SystemExit(f"Unexpected generated fields: ring={found_ring}, pad={found_pad}")
          p.write_text("\n".join(out) + "\n")

          # Keep the generator's container allow-list current.
          p = Path("tools/gen-player-copy.mjs")
          s = p.read_text()
          old = '"m_ringRelatedSet", "m_touchedRings", "m_jumpPadRelated", "m_holdingButtons"'
          new = '"m_usedRings", "m_touchedRings", "m_holdingButtons"'
          if s.count(old) != 1:
              raise SystemExit("Expected container allow-list was not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Stabilize Android self-check and status label
        working-directory: mod-src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/Hooks.cpp")
          s = p.read_text()

          old = """                startSelfCheck(play, static_cast<PIBPlayLayer*>(play)->simPlayer(), tick);"""
          new = """#if !defined(GEODE_IS_ANDROID)
                          startSelfCheck(play, static_cast<PIBPlayLayer*>(play)->simPlayer(), tick);
          #endif"""
          if s.count(old) != 1:
              raise SystemExit("Expected Android self-check call exactly once")
          s = s.replace(old, new, 1)

          start = s.find('        auto label = CCLabelBMFont::create("", "chatFont.fnt");')
          finish = s.find("        this->refreshStatus();", start)
          if start < 0 or finish < 0:
              raise SystemExit("Could not locate status label creation lines")
          finish += len("        this->refreshStatus();")
          new = """        auto label = CCLabelBMFont::create("Input Buffer", "chatFont.fnt");
                  if (!label) label = CCLabelBMFont::create("Input Buffer", "bigFont.fnt");
                  if (label) {
                      auto winSize = CCDirector::get()->getWinSize();
                      label->setAnchorPoint({ 0.f, 1.f });
                      label->setScale(0.5f);
                      label->setOpacity(220);
                      label->setPosition({ 8.f, winSize.height - 24.f });
                      label->setZOrder(100000);
                      this->addChild(label, 100000);
                      m_fields->status = label;
                      this->refreshStatus();
                  }
                  else {
                      log::error("Predictive Input: could not create status label (chatFont.fnt/bigFont.fnt)");
                  }"""
          s = s[:start] + new + s[finish:]
          p.write_text(s)
          PY

      - name: Fix live input interception and expose predictor decisions
        working-directory: mod-src
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/Hooks.cpp")
          s = p.read_text()

          # In a live PlayLayer, m_useReplay is the authoritative replay guard.
          # Avoid rejecting ordinary touch input due to the secondary playback
          # state field, which is not needed for this PlayLayer-only buffer.
          old = "if (layer->m_useReplay || layer->m_playbackMode != PlaybackMode::Not) return false;"
          new = "if (layer->m_useReplay) return false;"
          if s.count(old) != 1:
              raise SystemExit("Expected replay guard exactly once")
          s = s.replace(old, new, 1)

          old = "if (!InputQueue::isFiring()) noteInput(down, queue.currentTick());"
          new = (
              "if (!InputQueue::isFiring()) {\\n"
              "                noteInput(down, queue.currentTick());\\n"
              "                lastSave = down ? \\"input received\\" : \\"release received\\";\\n"
              "                refreshStatus();\\n"
              "                log::debug(\\"input hook received {} at tick {}\\",\\n"
              "                    down ? \\"press\\" : \\"release\\", queue.currentTick());\\n"
              "            }"
          )
          if s.count(old) != 1:
              raise SystemExit("Expected live input tracking call exactly once")
          s = s.replace(old, new, 1)

          old = """                log::debug("{} checked in {} us: no delay", down ? "press" : "release", decision.micros);"""
          new = """                lastSave = fmt::format("checked: no safe delay ({} us)", decision.micros);
                          refreshStatus();
                          log::info("{} checked in {} us: no safe delay",
                              down ? "press" : "release", decision.micros);"""
          if s.count(old) != 1:
              raise SystemExit("Expected predictor no-delay log exactly once")
          s = s.replace(old, new, 1)

          old = "int fireTick = earliest;\\n        if (!relevant && !queue.empty()) {"
          new = (
              "int fireTick = earliest;\\n"
              "        if (!relevant) {\\n"
              "            lastSave = fmt::format(\\"not buffered: {}\\", players.empty() ? \\"no player\\" :\\n"
              "                gamemodeName(gamemodeOf(players.front())));\\n"
              "            refreshStatus();\\n"
              "        }\\n"
              "        if (!relevant && !queue.empty()) {"
          )
          if s.count(old) != 1:
              raise SystemExit("Expected relevant-input decision block exactly once")
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Build Geode mod for Android64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-beta.2
          cli: latest
          target: Android64
          path: mod-src
          build-config: Release

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: PredictiveInput-Android64-Beta2
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
